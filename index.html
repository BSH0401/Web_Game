<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>프로게이머 키우기</title>
<style>
:root{
  --bg:#0c0f16; --panel:#151a25; --panel2:#1c2231; --line:#2a3246;
  --text:#e9edf5; --muted:#8b95aa; --accent:#4f8cff; --accent2:#a46bff;
  --good:#3ecf8e; --bad:#ff5d6c; --warn:#ffb547; --gold:#ffd166;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:15px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1120px;margin:0 auto;padding:16px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px}
.logo span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.status{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;white-space:nowrap}
.pill.hot{border-color:var(--accent);color:#cfe0ff}
.pill.bad{border-color:var(--bad);color:#ffc2c8}
.pill.warn{border-color:var(--warn);color:#ffe0b0}
.grid{display:grid;grid-template-columns:320px 1fr;gap:14px}
@media (max-width:820px){.grid{grid-template-columns:1fr}.bars{display:grid;grid-template-columns:1fr 1fr;column-gap:14px}.genres{display:grid;grid-template-columns:1fr 1fr;gap:8px}.genres .genrebox{margin-top:0}}
.genres{margin-top:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h3{margin:0 0 10px;font-size:14px;color:var(--muted);font-weight:600;letter-spacing:.3px}
.stat{margin-bottom:9px}
.stat .row{display:flex;justify-content:space-between;font-size:13px}
.bar{height:7px;background:#0b0e15;border-radius:9px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s}
.bar.fat i{background:linear-gradient(90deg,var(--good),var(--warn),var(--bad))}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-top:1px dashed var(--line)}
.kv b{font-weight:600}
.genrebox{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 10px;margin-top:6px;font-size:12.5px}
.genrebox.main{border-color:var(--accent)}
.genrebox .t{display:flex;justify-content:space-between;font-weight:600}
.stars{color:var(--gold);letter-spacing:1px}
.power{font-size:30px;font-weight:800;line-height:1}
.power small{font-size:12px;color:var(--muted);font-weight:500;margin-left:6px}
.next{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.next .info{font-size:13px;color:var(--muted)}
.next .info b{color:var(--text)}
.actions{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.act{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 11px;text-align:left;transition:.15s}
.act:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}
.act:disabled{opacity:.35;cursor:not-allowed}
.act .i{font-size:20px}
.act b{display:block;font-size:14px;margin-top:2px}
.act small{display:block;color:var(--muted);font-size:12px}
.sub{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.sbtn{background:transparent;border:1px solid var(--line);border-radius:9px;padding:6px 11px;font-size:13px;color:var(--muted)}
.sbtn:hover{color:var(--text);border-color:var(--accent2)}
.log{max-height:430px;overflow:auto;margin-top:6px;padding-right:4px}
.entry{border-left:3px solid var(--line);padding:6px 10px;margin-bottom:8px;font-size:13.5px}
.entry .when{font-size:11px;color:var(--muted)}
.entry.good{border-color:var(--good)} .entry.bad{border-color:var(--bad)} .entry.key{border-color:var(--gold)} .entry.news{border-color:var(--accent2)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{font-size:11.5px;padding:1px 7px;border-radius:6px;background:#0b0e15;border:1px solid var(--line)}
.chip.up{color:var(--good)} .chip.down{color:var(--bad)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(5,7,12,.72);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.ov.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:100%;max-width:520px;max-height:90vh;overflow:auto;padding:18px;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.modal h2{margin:0 0 8px;font-size:19px}
.modal p{margin:6px 0}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.choice{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;text-align:left}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice:disabled{opacity:.35;cursor:not-allowed}
.choice small{display:block;color:var(--muted);font-size:12px}
.vs{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--panel2);border-radius:12px;padding:10px 12px;margin:8px 0;font-weight:700}
.vs .mid{color:var(--muted);font-size:13px}
.score{font-size:34px;font-weight:800;text-align:center;margin:6px 0}
.pbp{list-style:none;padding:0;margin:8px 0;font-size:13.5px}
.pbp li{padding:5px 8px;border-radius:8px;margin-bottom:4px;background:var(--panel2)}
.pbp li.w{border-left:3px solid var(--good)} .pbp li.l{border-left:3px solid var(--bad)}
.pog{color:var(--gold);font-weight:700;text-align:center}
.prob{height:8px;background:var(--bad);border-radius:9px;overflow:hidden}
.prob i{display:block;height:100%;background:var(--good)}
/* start & ending */
.center{max-width:560px;margin:30px auto}
.big{font-size:30px;font-weight:800;margin:0 0 4px;letter-spacing:-.5px}
.muted{color:var(--muted)}
.gacha{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.gcell{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px}
.gcell .l{font-size:12px;color:var(--muted)}
.gcell .v{font-size:18px;font-weight:700}
.grade-S{color:var(--gold)} .grade-A{color:#9fd0ff} .grade-B{color:var(--text)} .grade-C{color:#b8a98a} .grade-D{color:var(--bad)}
input[type=text]{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--text);font:inherit}
.primary{background:linear-gradient(90deg,var(--accent),var(--accent2));border:0;border-radius:11px;padding:11px 18px;font-weight:700;color:#fff}
.ghost{background:transparent;border:1px solid var(--line);border-radius:11px;padding:10px 16px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.endcard{border:2px solid transparent;background:linear-gradient(var(--panel),var(--panel)) padding-box,linear-gradient(135deg,var(--accent),var(--accent2),var(--gold)) border-box;border-radius:18px;padding:20px}
.title-badge{display:inline-block;background:linear-gradient(90deg,var(--gold),#ff9f6b);color:#241500;font-weight:800;border-radius:9px;padding:4px 12px;margin:6px 0}
.trophy{font-size:15px;margin:3px 0}
.tl{border-left:2px solid var(--line);margin:10px 0 0 6px;padding-left:12px}
.tl div{font-size:13px;margin-bottom:5px;position:relative}
.tl div::before{content:"";position:absolute;left:-17px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--line)}
.tl div.good::before{background:var(--good)} .tl div.bad::before{background:var(--bad)} .tl div.key::before{background:var(--gold)}
.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo">🎮 <span>프로게이머 키우기</span></div>
    <div class="status" id="status"></div>
  </header>

  <!-- 시작 화면 -->
  <section id="start" class="center card"></section>

  <!-- 게임 화면 -->
  <section id="game" class="grid hide">
    <aside class="card" id="stats"></aside>
    <main>
      <div class="card">
        <div class="next" id="next"></div>
        <div class="actions" id="actions"></div>
        <div class="sub" id="subactions"></div>
      </div>
      <div class="card" style="margin-top:14px">
        <h3>📜 인생 기록</h3>
        <div class="log" id="log"></div>
      </div>
    </main>
  </section>

  <!-- 엔딩 -->
  <section id="ending" class="center hide"></section>
</div>

<div class="ov" id="modal"><div class="modal">
  <h2 id="mTitle"></h2><div id="mBody"></div><div class="choices" id="mChoices"></div>
</div></div>

<script>
/* ================= 기본 데이터 ================= */
const GENRES = {
  moba: {
    name:'MOBA', game:'배틀 오브 히어로즈', icon:'⚔️',
    w:{phys:.30, macro:.45, mental:.25},
    desc:'운영·팀워크가 중요. 연봉이 높고 경쟁이 치열하다.',
    tactics:[
      {label:'⚡ 한타 각 보기', desc:'피지컬로 승부. 고위험 고수익', mod:()=>(S.phys-60)/140 + rand(-.18,.18)},
      {label:'🧠 운영으로 굴리기', desc:'운영 능력 활용. 안정적', mod:()=>(S.macro-60)/180 + rand(-.05,.05)},
      {label:'🎯 상대 에이스 봉쇄', desc:'멘탈 싸움. 중간 위험', mod:()=>(S.mental-60)/160 + rand(-.1,.1)},
    ],
    win:['거대 수호자 앞 한타 대승! 그대로 밀고 들어갔다.','초반 솔로킬로 스노우볼을 굴렸다.','고대 용 스틸 성공! 짜릿한 역전승!','완벽한 시야 장악으로 상대를 질식시켰다.','백도어 성공! 관중석이 뒤집어졌다.'],
    lose:['한타 한 번에 무너졌다...','상대 정글러에게 초반부터 휘둘렸다.','고대 용을 스틸당하며 역전패.','운영 싸움에서 밀려 천천히 졌다.','교전 판단 미스가 뼈아팠다.']
  },
  fps: {
    name:'FPS', game:'택티컬 스트라이크', icon:'🎯',
    w:{phys:.60, macro:.15, mental:.25},
    desc:'반응속도(피지컬)가 전부. 전성기가 빠르고 짧다.',
    tactics:[
      {label:'💥 엔트리 돌격', desc:'피지컬로 첫 킬을 딴다. 고위험', mod:()=>(S.phys-60)/130 + rand(-.18,.18)},
      {label:'🛰️ 정보전 & 리테이크', desc:'운영으로 침착하게. 안정적', mod:()=>(S.macro-55)/180 + rand(-.05,.05)},
      {label:'🧊 클러치를 믿어라', desc:'멘탈 승부. 극단적 결과', mod:()=>(S.mental-60)/120 + rand(-.25,.25)},
    ],
    maps:['헤이븐 시티','더스트 포트','아이스박스 랩','사막 기지','네온 타워','폐공장'],
    win:['에이스 클러치! 1:4 역전 라운드','완벽한 리테이크','오퍼 2연속 헤드샷','에코 라운드 승리로 흐름을 잡았다'],
    lose:['피스톨 라운드부터 꼬였다','상대 오퍼에게 연속 헤드샷','클러치 상황에서 아쉬운 실수','상대의 속공에 대응하지 못했다'],
    ageMod:a=>a>24 ? 1-(a-24)*.04 : 1
  },
  rts: {
    name:'RTS', game:'갤럭시 커맨더', icon:'🛸',
    w:{phys:.35, macro:.40, mental:.25},
    desc:'1:1 개인전. 실력이 그대로 결과로 나온다. 리그가 축소될 위험이 있다.',
    solo:.25, drift:[.8,1.12],
    tactics:[
      {label:'⚔️ 초반 러시', desc:'손빠르기로 끝낸다. 고위험', mod:()=>(S.phys-60)/140 + rand(-.2,.2)},
      {label:'🏗️ 확장 운영', desc:'자원으로 찍어 누른다. 안정적', mod:()=>(S.macro-60)/170 + rand(-.05,.05)},
      {label:'🎭 심리전 페이크', desc:'상대의 판단을 흔든다', mod:()=>(S.mental-60)/150 + rand(-.15,.15)},
    ],
    maps:['로스트 템플','블레이드 캐년','서킷 브레이커','폴라 나이트','크로스 게임'],
    win:['앞마당 확장 후 물량으로 압살','드랍십 견제로 일꾼을 초토화','완벽한 타이밍 러시 성공','상대 빌드를 정확히 읽고 카운터'],
    lose:['초반 러시를 막지 못했다','자원 싸움에서 밀렸다','기습 드랍에 본진이 털렸다','후반 운영에서 역전당했다'],
    ageMod:a=>a>25 ? 1-(a-25)*.02 : 1
  },
  fight: {
    name:'격투', game:'파이트 크라운', icon:'🥊',
    w:{phys:.40, macro:.25, mental:.35},
    desc:'오래 할 수 있는 장인의 길. 나이가 들수록 노련해진다. 상금은 적지만 팬층이 단단하다.',
    solo:.4, pay:.6, decay:.4, drift:[.9,1.12],
    tactics:[
      {label:'🔥 러시 다운', desc:'쉴 틈 없이 몰아친다. 고위험', mod:()=>(S.phys-60)/140 + rand(-.18,.18)},
      {label:'🛡️ 견제와 딜레이 캐치', desc:'침착하게 빈틈을 노린다. 안정적', mod:()=>(S.macro-55)/170 + rand(-.05,.05)},
      {label:'🧠 읽기 싸움', desc:'상대의 다음 수를 읽는다. 극단적', mod:()=>(S.mental-60)/120 + rand(-.25,.25)},
    ],
    win:['퍼펙트 KO!','체력 1픽셀 남기고 역전!','10히트 콤보 작렬','완벽한 딜레이 캐치'],
    lose:['상대 잡기에 연속으로 당했다','콤보 실수가 뼈아팠다','읽기 싸움에서 졌다','타임오버 판정패'],
    ageMod:a=>a>23 ? 1+Math.min(a-23,6)*.008 : 1
  },
  br: {
    name:'배틀로얄', game:'라스트 아일랜드', icon:'🪂',
    w:{phys:.40, macro:.30, mental:.30},
    desc:'운 요소가 커서 결과가 들쭉날쭉하다. 방송 효율이 좋아 스트리머로 전환하기 유리하다.',
    solo:.6, variance:.55, streamMul:1.4, drift:[.84,1.14],
    tactics:[
      {label:'🪂 핫드랍 교전', desc:'초반부터 킬을 쓸어 담는다. 고위험', mod:()=>(S.phys-60)/140 + rand(-.25,.25)},
      {label:'🗺️ 자기장 운영', desc:'안전지대를 먼저 잡는다. 안정적', mod:()=>(S.macro-60)/170 + rand(-.05,.05)},
      {label:'🫥 존버 플레이', desc:'끝까지 살아남는다', mod:()=>(S.mental-60)/150 + rand(-.1,.1)},
    ],
    win:['자기장 운이 따랐다','마지막 1:1 교전 승리','고지대 선점 성공','풀 파티 섬멸'],
    lose:['초반 교전에서 전멸','자기장에 갇혀 쓸려나갔다','3파전 사이에 끼였다','차량 이동 중 저격당했다']
  }

const GKEYS = Object.keys(GENRES);
const GDEF = {solo:.6, pay:1, decay:1, drift:[.85,1.17], streamMul:1, variance:1, ageMod:()=>1};
for(const k of GKEYS) GENRES[k] = {...GDEF, ...GENRES[k]};
const META0 = {moba:1.1, fps:1.0, rts:.85, fight:.8, br:1.15};
const TEAMS = {
  moba:[['서울 드래곤즈',82],['부산 타이탄즈',78],['인천 팬텀',74],['대구 블레이즈',70],['광주 스톰',66],['수원 나이츠',62],['대전 볼트',57],['제주 웨이브',52]],
  fps:[['스틸 이글스',82],['네온 바이퍼',78],['크림슨 팽',74],['아이언 호크',70],['블랙 로터스',66],['실버 울프',62],['썬더 레이븐',57],['노바 스쿼드',52]],
  rts:[['서울 커맨더스',82],['부산 프론티어',78],['인천 제네시스',74],['대구 오버로드',70],['광주 아르테미스',66],['울산 스타게이트',62],['청주 레기온',57],['포항 코스모',52]],
  fight:[['콤보 브레이커즈',82],['KO 스트라이커즈',78],['아케이드 킹즈',74],['카운터 히트',70],['프레임 퍼펙트',66],['저스트 가드',62],['스틱 마스터즈',57],['라운드 원',52]],
  br:[['서바이벌 X',82],['아일랜드 킹즈',78],['파라슈트',74],['레드존',70],['에어드랍',66],['라스트맨',62],['블루존',57],['루터즈',52]]
};
const WORLD = ['LA 피닉스','베를린 울브즈','상하이 드래곤','도쿄 사무라이','상파울루 재규어','파리 레볼루션','스톡홀름 바이킹','코펜하겐 라이온'];
const RIVALS = ['블레이즈','섀도우','루나','제로','카이저','미라지'];
const FAMILIES = [
  {name:'금수저', emoji:'💰', money:5000, support:.9, mental:0, desc:'든든한 지원. 장비 걱정 없음'},
  {name:'평범한 집', emoji:'🏠', money:500, support:.5, mental:0, desc:'평범하지만 따뜻한 집'},
  {name:'흙수저', emoji:'🧱', money:30, support:.2, mental:10, desc:'헝그리 정신! 멘탈 +10'}
];
const TIERS = [[0,'브론즈'],[1000,'실버'],[1400,'골드'],[1800,'플래티넘'],[2100,'다이아'],[2400,'마스터'],[2650,'그랜드마스터'],[2850,'챌린저']];
const TRYOUT_MMR = 2100;
const STAT_LABEL = {phys:'피지컬',macro:'운영',mental:'멘탈',health:'체력',pop:'인기',edu:'학업',fatigue:'피로',money:'돈',skill:'숙련도',mmr:'랭크점수'};

/* ================= 유틸 ================= */
const $ = s => document.querySelector(s);
const rand = (a,b) => a + Math.random()*(b-a);
const ri = (a,b) => Math.floor(rand(a,b+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const clamp = (v,a=0,b=100) => Math.max(a,Math.min(b,v));
const chance = p => Math.random() < p;
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function won(m){ m=Math.round(m); return Math.abs(m)>=10000 ? (m/10000).toFixed(1)+'억원' : m.toLocaleString()+'만원'; }
const tierOf = m => { let t=TIERS[0][1]; for(const [v,n] of TIERS) if(m>=v) t=n; return t; };
const perG = v => Object.fromEntries(GKEYS.map(g=>[g, typeof v==='function'?v(g):v]));
function bestOther(){ return GKEYS.filter(g=>g!==S.genre && S.played[g]>=3 && S.apt[g]>=1.05).sort((a,b)=>S.apt[b]-S.apt[a])[0]; }
function grade(x){ return x>=1.2?'S':x>=1.08?'A':x>=.95?'B':x>=.87?'C':'D'; }
function stars(g){ const n=clamp(Math.round((S.apt[g]-.8)/.45*4)+1,1,5); return '★'.repeat(n)+'☆'.repeat(5-n); }
function storeGet(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function storeSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

/* ================= 상태 ================= */
let S = null, busy = false, roll = null, rerolls = 3;

function rollBirth(){
  const r = Math.random();
  const family = r<.15 ? FAMILIES[0] : r<.75 ? FAMILIES[1] : FAMILIES[2];
  return {
    family,
    talent:{phys:rand(.8,1.3), macro:rand(.8,1.3), mental:rand(.8,1.3)},
    base:{phys:ri(15,35), macro:ri(15,35), mental:ri(25,50)+family.mental, health:ri(30,60), edu:ri(20,60)},
    apt:perG(()=>rand(.8,1.25))
  };
}

function newLife(r, name){
  return {
    name, family:r.family, talent:r.talent, apt:r.apt,
    age:14, q:0, turn:0,
    phys:r.base.phys, macro:r.base.macro, mental:clamp(r.base.mental), health:r.base.health, edu:r.base.edu,
    pop:0, fatigue:10, money:r.family.money,
    skill:perG(0), mmr:perG(700), played:perG(0), meta:{...META0}, careerGenres:[],
    genre:null, team:null, tier:null, teamBonus:0, salaryMul:1, abroad:false, seed:99,
    injury:0, slump:0, yearChamp:false,
    trophies:{league:[],worlds:[]}, champGenres:[], seasons:0, pogs:0, earned:0,
    peakPop:0, peakMmr:700, wasPro:false, was2:false, switched:false, tryCool:0,
    rival:pick(RIVALS), flags:{}, seen:{}, cool:{}, history:[], log:[], ended:false
  };
}

/* ================= 핵심 계산 ================= */
const cg = () => S.genre || GKEYS.reduce((a,b)=>S.played[b]>S.played[a]?b:a);
function power(g=cg()){
  const w = GENRES[g].w;
  let p = (w.phys*S.phys + w.macro*S.macro + w.mental*S.mental) * (.55 + S.skill[g]/220) * S.apt[g];
  if(S.fatigue>70) p *= .88;
  if(S.slump>0) p *= .82;
  p *= GENRES[g].ageMod(S.age);
  return p;
}
const pw = () => power();
function teamRating(){ return S.team ? S.team.rating + S.teamBonus : 0; }
const eff = p => p>75 ? 75+(p-75)*.5 : p; // 고점에서는 실력 차이가 덜 벌어진다
function teamStr(){ const w=GENRES[S.genre].solo; return w*teamRating() + (1-w)*(S.injury>0 ? teamRating()-8 : eff(pw())); }
function winProb(opp){ return 1/(1+Math.exp(-(teamStr()-opp.rating)/8)); }
function autoWin(opp){ return chance(.5 + (winProb(opp)-.5)*GENRES[S.genre].variance); }

function grow(key, rate){
  const mult = (S.slump>0?.5:1) * (S.talent[key]||1);
  S[key] = clamp(S[key] + (100-S[key])*rate*mult);
}
function growSkill(g, rate){
  const mult = (S.slump>0?.5:1) * S.apt[g];
  S.skill[g] = clamp(S.skill[g] + (100-S.skill[g])*rate*mult);
}
function tire(n){ S.fatigue = clamp(S.fatigue + Math.max(2, n - S.health/12)); }
function fx(o){
  for(const k in o){
    const v=o[k];
    if(k==='skill') S.skill[cg()] = clamp(S.skill[cg()]+v);
    else if(k==='mmr'){ const g=cg(); S.mmr[g]=Math.max(0,S.mmr[g]+v); S.peakMmr=Math.max(S.peakMmr,S.mmr[g]); }
    else if(k==='money') S.money += v;
    else if(k==='teamBonus') S.teamBonus = clamp(S.teamBonus+v,-8,8);
    else S[k] = clamp(S[k]+v);
  }
  return '';
}
function snap(){ return {phys:S.phys,macro:S.macro,mental:S.mental,health:S.health,pop:S.pop,edu:S.edu,fatigue:S.fatigue,money:S.money,skill:S.skill[cg()],mmr:S.mmr[cg()]}; }
function diffHtml(a,b){
  const out=[];
  for(const k in a){
    const d = Math.round(b[k]-a[k]);
    if(!d) continue;
    const goodUp = k!=='fatigue';
    const cls = (d>0)===goodUp ? 'up' : 'down';
    const val = k==='money' ? (d>0?'+':'')+won(d) : (d>0?'+':'')+d;
    out.push(`<span class="chip ${cls}">${STAT_LABEL[k]} ${val}</span>`);
  }
  return out.length ? `<div class="chips">${out.join('')}</div>` : '';
}
function hist(text,type='key'){ S.history.push({age:S.age,q:S.q,text,type}); }
function log(text, chips='', type=''){ S.log.unshift({when:`${S.age}세 ${S.q+1}분기`, text, chips, type}); if(S.log.length>80) S.log.pop(); }

/* ================= 모달 ================= */
function modal({title, html='', choices=[{label:'확인'}]}){
  return new Promise(res=>{
    $('#mTitle').textContent = title;
    $('#mBody').innerHTML = html;
    const box = $('#mChoices'); box.innerHTML='';
    choices.forEach((c,i)=>{
      const b=document.createElement('button');
      b.className='choice'; b.disabled=!!c.disabled;
      b.innerHTML=`<b>${c.label}</b>${c.desc?`<small>${c.desc}</small>`:''}`;
      b.onclick=()=>{ $('#modal').classList.remove('show'); res(i); };
      box.appendChild(b);
    });
    $('#modal').classList.add('show');
  });
}
const info = (title, html) => modal({title, html});

/* ================= 행동 ================= */
function soloq(g){
  S.played[g]++;
  growSkill(g, .12);
  grow('phys', S.age<20 ? .055 : .03);
  grow('mental', .015);
  tire(17);
  const target = power(g)*45;
  const delta = Math.round((target - S.mmr[g])*.3 + rand(-90,90));
  S.mmr[g] = Math.max(0, S.mmr[g]+delta);
  S.peakMmr = Math.max(S.peakMmr, S.mmr[g]);
  let msg = `${GENRES[g].game} 솔로랭크를 달렸다. ${tierOf(S.mmr[g])} (${delta>=0?'+':''}${delta}점)`;
  if(S.played[g]===3) msg += `<br>💡 ${GENRES[g].game}에 대한 재능이 보인다: <span class="stars">${stars(g)}</span>`;
  return msg;
}
function getActions(){
  const inj = S.injury>0, A=[];
  if(!S.genre){
    for(const g of GKEYS) A.push({icon:GENRES[g].icon, label:`랭크: ${GENRES[g].name}`, desc:`${GENRES[g].game} · 숙련도·랭크↑`, dis:inj, run:()=>soloq(g)});
  } else {
    const g=S.genre;
    A.push({icon:GENRES[g].icon, label:'솔로랭크', desc:'숙련도·피지컬·랭크↑ 피로↑', dis:inj, run:()=>soloq(g)});
  }
  if(S.team) A.push({icon:'👥', label:'팀 연습', desc:'숙련도·운영·팀 호흡↑', dis:inj, run:()=>{
    growSkill(S.genre,.09); grow('macro',.04); fx({teamBonus:.6}); tire(15);
    return '팀원들과 스크림을 돌렸다. 호흡이 점점 맞아간다.'; }});
  A.push({icon:'🧠', label:'전략 분석', desc:'운영↑ (VOD·메타 공부)', run:()=>{
    grow('macro',.07); if(S.genre) growSkill(S.genre,.03); tire(8);
    return '프로 경기 VOD를 돌려보며 운영을 공부했다.'; }});
  A.push({icon:'🏃', label:'운동', desc:'체력↑ 피지컬 소폭↑', run:()=>{
    grow('health',.1); grow('phys',.025); tire(5); S.fatigue=clamp(S.fatigue-4);
    return inj ? '재활 운동으로 손목을 관리했다.' : '헬스장에서 땀을 흘렸다. 몸이 가볍다.'; }});
  A.push({icon:'📺', label:'방송', desc:'인기·돈↑', run:()=>{
    const meta = S.genre ? S.popMeta()[S.genre] : 1;
    const sm = S.genre ? GENRES[S.genre].streamMul : 1;
    const gain = (2 + (S.team?1.5:0)) * meta * sm * (1 - S.pop/130);
    const cash = Math.round(S.pop*4*meta*sm + 20);
    S.pop = clamp(S.pop+gain); S.money += cash; S.earned += cash; tire(6);
    return `개인 방송을 켰다. 시청자 ${Math.round(30+S.pop*S.pop*3)}명!`; }});
  A.push({icon:'🛌', label:'휴식', desc:'피로↓↓ 멘탈↑', run:()=>{
    S.fatigue=clamp(S.fatigue-40); grow('mental',.06);
    return '푹 쉬었다. 머리가 맑아졌다.'; }});
  if(S.age<19) A.push({icon:'📚', label:'학교 공부', desc:'학업↑ 부모님 신뢰↑', run:()=>{
    grow('edu',.1); tire(6); S.flags.trust=(S.flags.trust||0)+1;
    return '학교 수업에 집중했다. 부모님이 흐뭇해하신다.'; }});
  return A;
}
async function doAction(a){
  if(busy || S.ended) return;
  busy=true; render();
  const b=snap();
  const msg=a.run();
  log(`${a.icon} ${msg}`, diffHtml(b,snap()));
  render();
  await endOfTurn();
  busy=false;
  if(!S.ended){ render(); save(); }
}

/* ================= 턴 진행 ================= */
async function endOfTurn(){
  S.fatigue = clamp(S.fatigue-6);
  S.pop = clamp(S.pop - S.pop*.03*(S.genre?GENRES[S.genre].decay:1)); // 인기는 가만히 두면 조금씩 식는다
  // 컨디션
  if(S.injury>0){ S.injury--; if(!S.injury) log('🩹 부상에서 회복했다!','', 'good'); }
  else if(S.fatigue>90 && chance(.35)){
    S.injury=2; S.phys=clamp(S.phys-3); hist('과로로 손목 부상','bad');
    await info('🚑 부상!', '<p>무리한 연습 끝에 손목 부상을 당했다.<br>2분기 동안 랭크와 팀 연습을 할 수 없다.</p>');
  }
  if(S.slump>0){ S.slump--; if(!S.slump) log('🌤️ 슬럼프에서 벗어났다.','', 'good'); }
  else if((S.fatigue>75 && chance(.3)) || (S.mental<20 && chance(.4))){
    S.slump=2; hist('슬럼프','bad');
    await info('🌧️ 슬럼프', '<p>손이 굳은 것 같다. 아무리 해도 실력이 늘지 않는다...<br>(2분기 동안 성장 절반, 전투력 하락)</p>');
  }
  // 시즌
  if(S.tier==='1군') await seasonStep();
  else if(S.tier==='2군' && pw() >= teamRating()-8){
    S.tier='1군'; S.wasPro=true; S.seed=99; hist(`${S.team.name} 1군 승격!`,'key');
    await info('⬆️ 1군 승격!', `<p>감독이 불렀다. "다음 시즌부터 1군 주전이다."</p><p><b>${esc(S.team.name)}</b> 1군 데뷔!</p>`);
  }
  // 수입
  if(S.tier){
    const meta = S.popMeta()[S.genre];
    const sal = S.tier==='1군' ? Math.round((400 + pw()*8 + S.pop*8) * meta * GENRES[S.genre].pay * S.salaryMul) : 150;
    S.money += sal; S.earned += sal;
  }
  // 랜덤 이벤트
  if(chance(.55)) await randomEvent();
  if(S.ended) return;
  // 시간 흐름
  S.turn++; S.q++;
  if(S.q>3){ S.q=0; await newYear(); if(S.ended) return; }
  S.peakPop = Math.max(S.peakPop, S.pop);
  await milestones();
}

async function newYear(){
  S.age++; S.yearChamp=false;
  if(S.age>=23){ S.phys = clamp(S.phys - (S.age-22)*2); }
  if(S.age>=24){ S.mental = clamp(S.mental - 1); }
  if(S.age>=26){ S.health = clamp(S.health-2); }
  // 메타 변화
  const news=[];
  for(const g of GKEYS){
    const before=S.meta[g], [lo,hi]=GENRES[g].drift;
    S.meta[g] = clamp(before*rand(lo,hi), .5, 1.6);
    const d=S.meta[g]-before;
    if(d>.1) news.push(`🔥 ${GENRES[g].game} 시청자 급증! 리그 연봉·인기 상승`);
    if(d<-.1) news.push(`📉 ${GENRES[g].game} 인기 하락, 리그 축소 우려`);
  }
  if(S.age>=15) news.forEach(n=>log(n,'','news'));
  log(`🎂 ${S.age}살이 되었다.`);
  if(S.age>=29){ await info('⏳ 은퇴할 시간', '<p>몸이 예전 같지 않다. 선수 생활의 마침표를 찍을 때가 왔다.</p>'); await retire(); return; }
  if(!S.team && S.age>=22){ await info('🌙 꿈의 끝', '<p>프로의 문은 끝내 열리지 않았다. 이제 다른 길을 찾아야 한다.</p>'); await retire(); return; }
  if(!S.team && S.age===20 && !S.flags.lastChance){
    const i = await modal({title:'🤔 진로 고민', html:'<p>스무 살. 친구들은 대학에 가거나 일을 시작했다.<br>아직 프로 팀의 연락은 없다.</p>', choices:[
      {label:'딱 2년만 더 도전한다', desc:'22살까지 프로가 못 되면 끝'},
      {label:'꿈을 접고 현실로 돌아간다', desc:'지금 인생을 마무리'}]});
    if(i===1){ await retire(); return; }
    S.flags.lastChance=true; hist('2년 더 도전하기로 결심','key');
  }
}

async function milestones(){
  // 주력 장르 결정
  if(!S.genre && S.age>=16){ await chooseGenre(true); }
  // 입단 테스트
  if(S.genre && !S.team && S.age>=16 && S.mmr[S.genre]>=TRYOUT_MMR && S.turn>=S.tryCool) await tryout();
}

async function chooseGenre(forced){
  const html = GKEYS.map(g=>`<div class="genrebox"><div class="t"><span>${GENRES[g].icon} ${GENRES[g].game} <small class="muted">${GENRES[g].name}</small></span>
    <span class="stars">${S.played[g]>=3?stars(g):'??? '}</span></div>
    <div class="muted">${GENRES[g].desc}</div>
    <div>랭크 ${tierOf(S.mmr[g])} · 숙련도 ${Math.round(S.skill[g])} · 리그 인기 ${S.meta[g].toFixed(2)}x</div></div>`).join('');
  const choices=GKEYS.map(g=>({label:`${GENRES[g].icon} ${GENRES[g].game}에 올인`, desc:`예상 전투력 ${Math.round(power(g))}`}));
  if(!forced) choices.push({label:'아직 더 고민한다'});
  const i = await modal({title:'🎯 주력 장르 선택', html:`<p>${forced?'열여섯 살. 이제 한 길을 정해야 할 때다.':'어떤 게임으로 프로를 노릴까?'}</p>${html}`, choices});
  if(i>=GKEYS.length) return;
  const g=GKEYS[i];
  S.genre=g; S.careerGenres.push(g); hist(`${GENRES[g].game}(${GENRES[g].name})를 주력 장르로 결정`,'key');
  log(`🎯 주력 장르: ${GENRES[g].game}`,'','key');
}

async function tryout(){
  const g=S.genre, p=pw();
  let list = TEAMS[g].map(([name,rating])=>({name,rating})).filter(t=>t.rating<=p+18).sort((a,b)=>b.rating-a.rating).slice(0,3);
  if(!list.length) list=[{name:TEAMS[g][7][0], rating:TEAMS[g][7][1]}];
  const choices = list.map(t=>({label:`${t.name} 입단`, desc:`팀 전력 ${t.rating} · ${p>=t.rating-8?'바로 1군 주전!':'2군(연습생)부터 시작'}`}));
  choices.push({label:'아직 준비가 덜 됐다', desc:'다음 기회를 노린다'});
  const i = await modal({title:'📞 프로팀 스카우트!', html:`<p>${tierOf(S.mmr[g])} 랭커가 된 당신에게 프로팀들의 연락이 왔다!</p><p class="muted">현재 전투력 ${Math.round(p)}</p>`, choices});
  if(i===list.length){ S.tryCool=S.turn+2; return; }
  joinTeam(list[i]);
  await info('✍️ 계약 완료', `<p><b>${esc(list[i].name)}</b> ${S.tier} 계약서에 사인했다!</p><p class="muted">${S.tier==='1군'?'곧바로 시즌에 출전한다.':'전투력을 올려 1군 승격을 노리자.'}</p>`);
}
function joinTeam(t){
  S.team={name:t.name, rating:t.rating}; S.teamBonus=0; S.seed=99; S.abroad=!!t.abroad;
  S.tier = pw()>=t.rating-8 ? '1군' : '2군';
  if(S.tier==='1군') S.wasPro=true; else S.was2=true;
  hist(`${t.name} ${S.tier} 입단`,'key');
}

/* ================= 시즌 & 경기 ================= */
function randomOpp(){
  const own = S.team.name;
  if(S.abroad){ const n=pick(WORLD.filter(x=>x!==own)); return {name:n, rating:ri(60,82)}; }
  const t = pick(TEAMS[S.genre].filter(x=>x[0]!==own));
  return {name:t[0], rating:t[1]+ri(-3,3)};
}
function setLine(g,n,win){
  const G=GENRES[g];
  const c = win?'w':'l', line = pick(win?G.win:G.lose);
  if(g==='moba') return `<li class="${c}">${n}세트 ${win?'승':'패'} — ${line}</li>`;
  if(g==='rts') return `<li class="${c}">${n}세트 ${pick(G.maps)} <b>${win?'승':'패'}</b> — ${line}</li>`;
  if(g==='fight') return `<li class="${c}">${n}게임 <b>${win?'2 : '+ri(0,1):ri(0,1)+' : 2'}</b> — ${line}</li>`;
  if(g==='br'){ const place = win ? (chance(.4)?'🍗 1위 치킨!':`${ri(2,4)}위`) : `${ri(6,16)}위`; return `<li class="${c}">${n}라운드 <b>${place}</b> · ${ri(win?4:0,win?14:5)}킬 — ${line}</li>`; }
  const ot = chance(.15), lo = ot ? 12 : ri(3,11), hi = ot ? 14 : 13;
  return `<li class="${win?'w':'l'}">${n}맵 ${pick(G.maps)} <b>${win?hi:lo} : ${win?lo:hi}</b> — ${pick(win?G.win:G.lose)}</li>`;
}
async function featured(opp, stage, bo, weight=1){
  const g=S.genre, G=GENRES[g], need=Math.ceil(bo/2);
  const base=winProb(opp);
  let mod=0, tName='';
  if(S.injury>0){
    tName='부상으로 결장';
  } else {
    const pct=Math.round(clamp(.5+(base-.5)*G.variance,.05,.95)*100);
    const i = await modal({title:`🏟️ ${stage}`, html:`
      <div class="vs"><span>${esc(S.team.name)}</span><span class="mid">VS</span><span>${esc(opp.name)}</span></div>
      <div class="prob"><i style="width:${pct}%"></i></div>
      <p class="muted">예상 승률 <b style="color:var(--text)">${pct}%</b> · ${bo}판 ${need}선승제 · 상대 전력 ${opp.rating}</p>
      ${g==='br'?'<p class="muted">라운드마다 상대 팀보다 높은 순위를 차지하면 승리</p>':''}<p>감독: "오늘 작전은 네가 정해라."</p>`, choices:G.tactics.map(t=>({label:t.label,desc:t.desc}))});
    mod=G.tactics[i].mod(); tName=G.tactics[i].label;
  }
  const p=clamp(.5 + (base+mod-.5)*G.variance, .05, .95);
  let w=0,l=0,n=1; const lines=[];
  while(w<need && l<need){ const win=chance(p); win?w++:l++; lines.push(setLine(g,n++,win)); }
  const win = w===need;
  let pog=false;
  if(win && S.injury<=0 && chance(clamp(.2+(pw()-60)/60,.05,.7))){ pog=true; S.pogs++; }
  const meta=S.popMeta()[g];
  S.pop = clamp(S.pop + (win ? (1+(pog?2:0))*weight*meta : -weight*.8));
  S.mental = clamp(S.mental + (win?.7:-2));
  await modal({title: win?'🏆 승리!':'💀 패배', html:`
    <p class="muted" style="text-align:center">${esc(stage)} · 작전: ${tName}</p>
    <div class="score">${w} : ${l}</div><ul class="pbp">${lines.join('')}</ul>
    ${pog?'<p class="pog">🌟 POG(Player of the Game) 선정!</p>':''}`, choices:[{label:'계속'}]});
  return win;
}
async function regularSeason(name){
  let w=0,l=0;
  (await featured(randomOpp(), `${name} 정규시즌 빅매치`, 3)) ? w++ : l++;
  for(let i=0;i<6;i++) autoWin(randomOpp()) ? w++ : l++;
  S.seasons++;
  S.seed = w>=6?1 : w>=5?2 : w>=4?ri(3,4) : w>=3?ri(5,6) : ri(7,8);
  const txt = `${name} 정규시즌 ${w}승 ${l}패 · ${S.seed}위${S.seed<=4?' (플레이오프 진출!)':''}`;
  log(`📊 ${txt}`,'', S.seed<=4?'good':'bad');
  await info('📊 정규시즌 종료', `<p><b>${txt}</b></p>`);
}
async function playoffs(name){
  if(S.seed>4){ log(`😢 ${name} 플레이오프 진출 실패`,'','bad'); return; }
  if(!(await featured(randomOpp(), `${name} 플레이오프 4강`, 5, 2))){ log(`${name} 4강 탈락`,'','bad'); return; }
  const fin={name:pick(TEAMS[S.genre].filter(x=>x[0]!==S.team.name).slice(0,3))[0], rating:ri(74,84)};
  if(S.abroad) fin.name=pick(WORLD.filter(x=>x!==S.team.name));
  if(!(await featured(fin, `${name} 결승전`, 5, 3))){
    hist(`${name} 준우승`,'good'); log(`🥈 ${name} 준우승`,'','good'); return;
  }
  const label=`${S.age}세 ${name} (${GENRES[S.genre].game})`;
  S.trophies.league.push(label); if(!S.champGenres.includes(S.genre)) S.champGenres.push(S.genre);
  S.yearChamp=true; S.money+=1000; S.earned+=1000; S.pop=clamp(S.pop+12);
  hist(`${name} 우승! 🏆`,'key'); log(`🏆 ${name} 우승!`,'','key');
  await info('🏆 우승!!', `<p>꽃가루가 쏟아진다. <b>${esc(S.team.name)}</b>, ${name} 챔피언!</p><p class="muted">우승 상금 1,000만원 · 월드 챔피언십 진출권 획득</p>`);
}
async function worlds(){
  await info('🌍 월드 챔피언십', '<p>전 세계 최강팀들이 모였다. 세계 정상을 향한 도전이 시작된다!</p>');
  const stages=[['8강',ri(74,84)],['4강',ri(80,90)],['결승',ri(86,96)]];
  const used=[];
  for(const [st,r] of stages){
    const nm=pick(WORLD.filter(x=>x!==S.team.name && !used.includes(x))); used.push(nm);
    if(!(await featured({name:nm,rating:r}, `월드 챔피언십 ${st}`, 5, st==='결승'?5:3))){
      hist(`월드 챔피언십 ${st} 진출`,'good'); log(`🌍 월드 챔피언십 ${st}에서 탈락`,'',''); return;
    }
  }
  S.trophies.worlds.push(`${S.age}세 (${GENRES[S.genre].game})`);
  if(!S.champGenres.includes(S.genre)) S.champGenres.push(S.genre);
  S.money+=5000; S.earned+=5000; S.pop=clamp(S.pop+25); S.mental=clamp(S.mental+10);
  hist('🌍 월드 챔피언 등극!!','key'); log('🌍 월드 챔피언!!','','key');
  await info('👑 세계 정상!', `<p>당신은 이제 <b>월드 챔피언</b>이다!</p><p class="muted">상금 5,000만원 · 인기 폭발</p>`);
}
async function seasonStep(){
  if(S.q===0) await regularSeason('스프링');
  else if(S.q===1) await playoffs('스프링');
  else if(S.q===2) await regularSeason('서머');
  else {
    await playoffs('서머');
    if(S.yearChamp) await worlds();
    // 방출 체크
    if(pw() < teamRating()-18){
      hist(`${S.team.name} 방출`,'bad');
      await info('📦 방출 통보', `<p>"미안하지만 다음 시즌 계약은 없다." <b>${esc(S.team.name)}</b>에서 방출되었다.</p><p class="muted">랭크를 올려 다른 팀의 연락을 기다리자.</p>`);
      S.team=null; S.tier=null; S.salaryMul=1; S.abroad=false; S.tryCool=S.turn+1;
    }
  }
}

async function randomEvent(){
  const pool = EVENTS.filter(e=>(!e.once||!S.seen[e.id]) && (S.cool[e.id]||0)<=S.turn && e.cond());
  if(!pool.length) return;
  const e = pick(pool); S.seen[e.id]=true; S.cool[e.id]=S.turn+10;
  const text = typeof e.text==='function' ? e.text() : e.text;
  const ch = e.choices.map(c=>({label:c.label, desc:c.desc, disabled: typeof c.disabled==='function' ? c.disabled() : false}));
  if(ch.every(c=>c.disabled)) ch[ch.length-1].disabled=false;
  const i = await modal({title:e.title, html:`<p>${text}</p>`, choices:ch});
  const b=snap(); const r=e.choices[i].run(); const d=diffHtml(b,snap());
  log(`${e.title} — ${r}`, d);
  await modal({title:e.title, html:`<p>${r}</p>${d}`, choices:[{label:'확인'}]});
}

function doSwitch(g){
  const from=S.genre;
  S.genre=g; S.switched=true; S.pop=S.pop*.5; S.careerGenres.push(g);
  S.team=null; S.tier=null; S.teamBonus=0; S.salaryMul=1; S.abroad=false; S.seed=99; S.tryCool=0;
  hist(`${GENRES[from].game} → ${GENRES[g].game} 장르 전향`,'key');
  log(`🔄 ${GENRES[g].game}로 장르 전향!`,'','key');
}
async function askSwitch(){
  if(busy) return;
  const others=GKEYS.filter(g=>g!==S.genre);
  const i = await modal({title:'🔄 장르 전향', html:`<p>어떤 장르로 전향할까요?</p>

/* ================= 엔딩 ================= */
function computeTitle(){
  const W=S.trophies.worlds.length, L=S.trophies.league.length;
  if(W>=3) return '불멸의 황제';
  if(S.champGenres.length>=2) return '장르 파괴자';
  if(W>=1) return '월드 챔피언';
  if(L>=3) return '리그의 지배자';
  if(L>=1) return '리그 챔피언';
  if(S.flags.gold) return '금메달리스트';
  if(S.seasons>=8) return '꾸준한 베테랑';
  if(S.wasPro) return '1군 프로게이머';
  if(S.was2) return '만년 2군';
  if(S.peakMmr>=2850) return '랭크의 신 (프로 데뷔 실패)';
  return '꿈꾸던 게이머';
}
function careerText(){
  const c=S.career;
  if(c==='coach') return S.macro>=85 ? ['명장 감독','선수 시절의 운영 능력으로 명문팀 감독이 되어 우승을 휩쓸었다.'] : ['코치','후배들을 가르치며 e스포츠계에 남았다.'];
  if(c==='caster') return S.pop>=70 ? ['국민 해설','"이 목소리 없으면 결승이 아니다." 레전드 해설위원이 되었다.'] : ['해설위원','날카로운 분석으로 사랑받는 해설위원이 되었다.'];
  if(c==='streamer') return S.pop>=70 ? ['은퇴 후 대박 스트리머','구독자 수백만의 탑 스트리머! 선수 시절보다 더 벌었다.'] : S.pop>=40 ? ['인기 스트리머','꾸준한 시청자층과 함께 방송을 이어갔다.'] : ['소소한 스트리머','시청자는 적지만 즐겁게 방송 중이다.'];
  if(c==='biz') return S.money>=20000 ? ['e스포츠 구단주','모은 자금으로 직접 구단을 창단했다!'] : ['PC방 사장님','동네 최고의 PC방을 차렸다. 손님들이 사인을 받으러 온다.'];
  return S.edu>=65 ? ['대기업 직장인','늦게 시작한 공부로 번듯한 회사에 입사했다.'] : S.edu>=40 ? ['평범한 직장인','평범한 회사원이 되었다. 주말엔 여전히 게임을 한다.'] : ['인생 2회차 준비 중','이것저것 아르바이트를 하며 새 길을 찾고 있다.'];
}
function computeScore(){
  return Math.round(S.trophies.worlds.length*1500 + S.trophies.league.length*400 + (S.flags.gold?300:0)
    + S.seasons*60 + S.pogs*20 + S.peakPop*8 + S.earned/100 + S.peakMmr/10);
}

  const trophies = [
    ...S.trophies.worlds.map(t=>`<div class="trophy">👑 월드 챔피언 — ${t}</div>`),

  ].join('') || '<div class="muted">우승 기록 없음</div>';
  const tl = S.history.slice(-14).map(h=>`<div class="${h.type}">${h.age}세 · ${esc(h.text)}</div>`).join('') || '<div>조용한 인생이었다.</div>';

    <div class="btnrow"><button class="primary" onclick="restart()">🔁 다시 태어나기</button><button class="ghost" id="copyBtn" onclick="copyResult()">📋 결과 복사</button></div>
  </div>`;

function copyResult(){

}

    <p class="muted">게임을 사랑하는 14살로 태어났다. 어떤 패를 들고 시작할까?</p>
    <div class="gacha">
      <div class="gcell" style="grid-column:1/-1"><div class="l">가정 환경</div><div class="v">${r.family.emoji} ${r.family.name} <small class="muted" style="font-size:12px;font-weight:400">· ${r.family.desc} · 시작 자금 ${won(r.family.money)}</small></div></div>
      <div class="gcell"><div class="l">피지컬 재능</div><div class="v">${g('phys')} <small class="muted">(${r.base.phys})</small></div></div>
      <div class="gcell"><div class="l">운영 재능</div><div class="v">${g('macro')} <small class="muted">(${r.base.macro})</small></div></div>
      <div class="gcell"><div class="l">멘탈 재능</div><div class="v">${g('mental')} <small class="muted">(${clamp(r.base.mental)})</small></div></div>
      <div class="gcell"><div class="l">장르 적성</div><div class="v">??? <small class="muted" style="font-size:12px">플레이하며 발견</small></div></div>
    </div>
    <label class="muted" style="font-size:13px">닉네임</label>
    <input type="text" id="nick" maxlength="12" placeholder="예: 페이크" value="">
    <div class="btnrow">
      <button class="primary" onclick="startGame()">🎮 이 인생으로 시작</button>
      <button class="ghost" onclick="reroll()" ${rerolls<=0?'disabled style="opacity:.4"':''}>🎲 다시 뽑기 (${rerolls})</button>
      ${saved&&!saved.ended?`<button class="ghost" onclick="loadGame()">▶ 이어하기 (${esc(saved.name)}, ${saved.age}세)</button>`:''}
    </div>
    <p class="muted" style="font-size:12.5px;margin-top:16px">1턴 = 1분기(3개월). 14살부터 랭크를 올려 프로팀 스카우트를 받고, 리그 우승과 월드 챔피언을 노리세요.<br>MOBA·FPS·RTS·격투·배틀로얄 중 주력 장르를 고르고, 커리어 도중 전향도 할 수 있어요. 피로 관리를 잊지 마세요!</p>`;
}
function reroll(){ if(rerolls<=0) return; rerolls--; roll=rollBirth(); const n=$('#nick').value; showStart(); $('#nick').value=n; }
function startGame(){
  const name = ($('#nick').value.trim() || pick(['새싹','손가락천재','키보드워리어','에임봇','갓겜러'])).slice(0,12);
  S = newLife(roll, name); attachMeta();
  hist(`${roll.family.name}에서 태어난 게이머 ${name}, 꿈을 꾸기 시작하다`,'key');
  log(`🍼 ${roll.family.emoji} ${roll.family.name} 출신 ${esc(name)}의 게이머 인생이 시작됐다!`,'','key');
  $('#start').classList.add('hide'); $('#game').classList.remove('hide');
  render(); save();
}
function attachMeta(){
  S.meta = {...META0, ...(S.meta||{})};
  S.skill = {...perG(0), ...S.skill}; S.played = {...perG(0), ...S.played};
  S.mmr = {...perG(700), ...S.mmr};
  S.apt = {...perG(()=>rand(.8,1.25)), ...S.apt};
  if(!S.careerGenres) S.careerGenres = S.genre ? [S.genre] : [];
  S.popMeta=()=>S.meta;
}
function save(){ if(S && !S.ended){ const c={...S}; delete c.popMeta; storeSet('pg_save', c); } }
function loadGame(){ const s=storeGet('pg_save'); if(!s) return; S=s; attachMeta(); $('#start').classList.add('hide'); $('#game').classList.remove('hide'); render(); }

/* ================= 렌더 ================= */
function bar(label, v, cls=''){ return `<div class="stat"><div class="row"><span>${label}</span><b>${Math.round(v)}</b></div><div class="bar ${cls}"><i style="width:${clamp(v)}%"></i></div></div>`; }
function quarterName(){
  if(S.tier==='1군') return ['스프링 정규시즌','스프링 플레이오프','서머 정규시즌','서머 플레이오프'][S.q];
  return ['봄','여름','가을','겨울'][S.q];
}
function render(){
  if(!S) return;
  const g=cg();
  // 상단 상태
  const st=[`<span class="pill">${S.age}세 · ${S.q+1}분기 (${quarterName()})</span>`];
  st.push(S.team ? `<span class="pill hot">${esc(S.team.name)} ${S.tier}</span>` : `<span class="pill">${S.genre?'무소속':'아마추어'}</span>`);
  if(S.injury>0) st.push(`<span class="pill bad">🩹 부상 ${S.injury}</span>`);
  if(S.slump>0) st.push(`<span class="pill warn">🌧️ 슬럼프 ${S.slump}</span>`);
  if(S.fatigue>70) st.push(`<span class="pill warn">😵 과로</span>`);
  $('#status').innerHTML=st.join('');
  // 스탯
  const gb = GKEYS.map(k=>`<div class="genrebox ${S.genre===k?'main':''}">
    <div class="t"><span>${GENRES[k].icon} ${GENRES[k].game}</span><span class="stars">${S.played[k]>=3?stars(k):'???'}</span></div>
    <div class="muted">${tierOf(S.mmr[k])} ${S.mmr[k]}점 · 숙련도 ${Math.round(S.skill[k])} · 인기 ${S.meta[k].toFixed(2)}x</div></div>`).join('');
  $('#stats').innerHTML = `
    <h3>${esc(S.name)} <span class="muted">· ${S.family.emoji} ${S.family.name}</span></h3>
    <div class="power">${Math.round(pw())}<small>전투력 (${GENRES[g].name})</small></div>
    ${S.team?`<div class="muted" style="font-size:12.5px;margin:4px 0 10px">팀 전력 ${Math.round(teamRating())} · 시즌 출전 ${S.seasons}회</div>`:'<div style="height:10px"></div>'}
    <div class="bars">${bar('🖐️ 피지컬',S.phys)}${bar('🧠 운영',S.macro)}${bar('💎 멘탈',S.mental)}${bar('💪 체력',S.health)}${bar('⭐ 인기',S.pop)}${bar('📚 학업',S.edu)}${bar('😵 피로',S.fatigue,'fat')}</div>
    <div class="kv"><span>💰 자산</span><b>${won(S.money)}</b></div>
    <div class="kv"><span>🏆 우승</span><b>월드 ${S.trophies.worlds.length} · 리그 ${S.trophies.league.length}</b></div>
    <div class="genres">${gb}</div>`;
  // 다음 할 일 안내
  let hint='';
  if(!S.genre) hint = S.age>=15 ? '두 게임을 해보며 재능을 찾아보자. 16살이 되면 주력 장르를 정한다.' : '두 게임을 모두 해보며 재능을 찾아보자.';
  else if(!S.team) hint = `${GENRES[S.genre].game} 랭크 <b>${tierOf(TRYOUT_MMR)}</b> 달성 시 프로팀 스카우트! (현재 ${tierOf(S.mmr[S.genre])} ${S.mmr[S.genre]}점)`;
  else if(S.tier==='2군') hint = `1군 승격 조건: 전투력 <b>${Math.round(teamRating()-8)}</b> 이상`;
  else hint = `이번 분기: <b>${quarterName()}</b>`;
  $('#next').innerHTML = `<div class="info">${hint}</div><div class="info">무엇을 할까?</div>`;
  // 행동 버튼
  const acts=getActions();
  $('#actions').innerHTML='';
  acts.forEach(a=>{
    const b=document.createElement('button'); b.className='act'; b.disabled=busy||!!a.dis;
    b.innerHTML=`<span class="i">${a.icon}</span><b>${a.label}</b><small>${a.desc}</small>`;
    b.onclick=()=>doAction(a); $('#actions').appendChild(b);
  });
  // 보조 버튼
  const sub=[];
  if(!S.genre && S.age>=15) sub.push(`<button class="sbtn" onclick="chooseGenreBtn()">🎯 주력 장르 정하기</button>`);
  if(S.genre && S.age>=17) sub.push(`<button class="sbtn" onclick="askSwitch()">🔄 장르 전향</button>`);
  if((S.team&&S.age>=22)||(!S.team&&S.age>=19)) sub.push(`<button class="sbtn" onclick="askRetire()">🏁 은퇴하기</button>`);
  sub.push(`<button class="sbtn" onclick="if(confirm('처음부터 다시 시작할까요?')){storeSet('pg_save',null);restart();}">↺ 처음부터</button>`);
  $('#subactions').innerHTML=sub.join('');
  // 로그
  $('#log').innerHTML = S.log.map(e=>`<div class="entry ${e.type}"><div class="when">${e.when}</div>${e.text}${e.chips}</div>`).join('');
}
async function chooseGenreBtn(){ if(busy) return; busy=true; await chooseGenre(false); busy=false; render(); save(); }

/* ================= 시작 ================= */
roll = rollBirth();
showStart();
</script>
</body>
</html>
